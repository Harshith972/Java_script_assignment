<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>student result</title>
</head>
<body>
    <h1>student result</h1>
    <script>
        function calculateResult(marks) {
            
            
            if (marks >= 40) {
                return "Pass";
            } else {
                return "Fail";
            }
        }

        console.log(calculateResult(60));
        console.log(calculateResult(30));
    </script>
    
</body>
