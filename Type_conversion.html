<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Type conversion</title>
</head>
<body>
    <h1>Type conversion</h1>

    <script>
        let a = "10";
        let b = 20;
        let c = 1;

        console.log(Number(a), typeof Number(a));

        console.log(String(b), typeof String(b));

        console.log(Boolean(c), typeof Boolean(c));

        console.log(parseInt("25.5"), typeof parseInt("25.5"));

        console.log(parseFloat("25.5"), typeof parseFloat("25.5"));

    </script>
    
</body>
</html>
