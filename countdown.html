<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>countdown</title>
</head>
<body>
    <h1>countdown</h1>

    <script>
        let i = 10;

        while (i >= 1) {
            console.log(i);
            i--;
        }

        console.log("Countdown completed");

    </script>
    
</body>
</html>
