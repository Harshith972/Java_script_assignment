<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comparision operators</title>
</head>
<body>

    <h1>Comparision operators</h1>

    <script>

        let x = 20;
        let y = "20";

        console.log(x == y);  
        console.log(x === y);  
        console.log(x != y);  
        console.log(x !== y);  
        console.log(x > y);   
        console.log(x < y);   
        console.log(x >= y);   
        console.log(x <= y);
          


    </script>    
</body>
</html>
