<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>closure</title>
</head>
<body>
    <h1>closure</h1>
    <script>
        function createCounter() {
            let count = 0;

            return function () {
                count++;
                console.log(count);
            };
        }

        let counter = createCounter();

        counter();
        counter();
        counter();
    </script>    
</body>
</html>
