<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>grade calculator</title>
</head>
<body>
    <h1>Grade Calculator</h1>

    <script>
        let marks = 96;

        if (marks < 0 || marks > 100) {
            console.log("Invalid marks");
        } else if (marks >= 90) {
            console.log("Grade A");
        } else if (marks >= 75) {
            console.log("Grade B");
        } else if (marks >= 60) {
            console.log("Grade C");
        } else if (marks >= 40) {
            console.log("Grade D");
        } else {
            console.log("Fail");
        }

    </script>
    
</body>
</html>
